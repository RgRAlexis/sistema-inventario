name: Liberacion del Sistema de Inventario

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  liberar:
    name: Probar, empaquetar y publicar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ejecutar pruebas
        run: |
          javac -d test-out src/*.java tests/*.java
          java -cp test-out ProductoTest

      - name: Crear paquete
        run: |
          javac -d out src/*.java
          jar cfe sistema-inventario.jar Producto -C out .
          zip -r sistema-inventario-${GITHUB_REF_NAME}.zip sistema-inventario.jar src/

      - name: Publicar version
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} - Sistema de Inventario
          files: sistema-inventario-${{ github.ref_name }}.zip
          generate_release_notes: true
